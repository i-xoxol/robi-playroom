<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Робі — a little robot for big questions</title><desc id="desc">A friendly mint robot beside the Ukrainian playroom title on a dark blue background.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172f42"/><stop offset="1" stop-color="#345c65"/></linearGradient><linearGradient id="bot" x2="1" y2="1"><stop stop-color="#ddfff0"/><stop offset="1" stop-color="#83d6c8"/></linearGradient></defs>
<rect width="1280" height="420" rx="28" fill="url(#bg)"/>
<circle cx="1060" cy="210" r="205" fill="#c4e9d5" opacity=".05"/>
<rect x="68" y="63" width="210" height="31" rx="15" fill="#b6dfce" opacity=".13"/>
<text x="88" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#c0e9d6">UKRAINIAN PLAYROOM</text>
<text x="63" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="105" font-weight="750" letter-spacing="-4" fill="#fff9e9">Робі.</text>
<text x="68" y="254" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="600" fill="#e9f1dc">A little robot. Big questions.</text>
<text x="68" y="298" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#b5cdc5">Talk in Ukrainian. Count the stars. Wonder together.</text>
<text x="68" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="2" fill="#e1c57e">REALTIME VOICE  ·  ONE CLEAR SCREEN  ·  SELF-HOSTED</text>
